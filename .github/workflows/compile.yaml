name: Create Artifacts
on:
  release:
    types:
      - created
  push: {}
  pull_request: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: main
        submodules: true
      name: Checkout Repository

    - name: Extract Metadata
      id: metadata
      run: python3 main/_DO_NOT_INCLUDE/extract-metadata.py ${{ github.ref }}

    - name: Add Universe Repository
      run: sudo add-apt-repository universe

    - name: Update Packages
      run: sudo apt-get update

    - name: Install Dependencies
      run: sudo apt-get install --assume-yes wine-stable wine64 python3-pip libfuse2 zip

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install makelove
      run: pip3 install git+https://github.com/pfirsich/makelove/

    # --- Desktop Builds ---
    - name: Build Desktop Artifacts
      run: |
        cd main
        python3 -m makelove --version-name ${{ steps.metadata.outputs.version }}
        cd ..

    - name: Rename AppImage
      run: mv main/makelove-build/${{ steps.metadata.outputs.version }}/appimage/${{ steps.metadata.outputs.id }}.AppImage main/makelove-build/${{ steps.metadata.outputs.version }}/appimage/${{ steps.metadata.outputs.id }}-linux.AppImage

    # --- Android Build ---
    # Same pipeline Mari0: AE uses: qixils/love-actions-android compiles the
    # LÖVE 11.x runtime from source (matching the game's LÖVE 11.4 target),
    # packs the .love, and outputs signed release + debug APKs.
    # For stable updates across releases, store these repo secrets:
    #   ANDROID_KEYSTORE_B64       base64 of your keystore file
    #   ANDROID_KEYSTORE_PASSWORD  keystore password
    #   ANDROID_KEY_PASSWORD       key password
    #   ANDROID_KEY_ALIAS          key alias
    # Without them, the action still produces a debug APK (installable, but
    # Android won't update an installed copy from an earlier signed build).
    - name: Compute Android version code
      id: android-version
      run: |
        V="${{ steps.metadata.outputs.version }}"
        IFS='.' read -r MA MI PA <<< "$V"
        echo "code=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_OUTPUT"

    - name: Build Android APK
      id: build-android
      uses: qixils/love-actions-android@v1
      env:
        ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'mari0droid' }}
      with:
        app-name: ${{ steps.metadata.outputs.title }}
        bundle-id: com.gitsnup.mari0droid
        product-name: ${{ steps.metadata.outputs.id }}
        resource-path: "main/.android-resources"
        love-ref: "11.x"
        love-package: "main/makelove-build/${{ steps.metadata.outputs.version }}/love/${{ steps.metadata.outputs.id }}.love"
        remote-libs: "https://github.com/qixils/lua-https"
        version-string: ${{ steps.metadata.outputs.version }}
        version-code: ${{ steps.android-version.outputs.code }}
        output-folder: "main/makelove-build/${{ steps.metadata.outputs.version }}/android"
        keystore-alias: ${{ env.ANDROID_KEY_ALIAS }}
        keystore-base64: ${{ env.ANDROID_KEYSTORE_B64 }}
        keystore-key-password: ${{ env.ANDROID_KEY_PASSWORD || env.ANDROID_KEYSTORE_PASSWORD }}
        keystore-store-password: ${{ env.ANDROID_KEYSTORE_PASSWORD }}

    # --- CI Artifact Uploads ---
    - name: Artifact (LÖVE)
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.metadata.outputs.id }}-source
        path: main/makelove-build/${{ steps.metadata.outputs.version }}/love/${{ steps.metadata.outputs.id }}.love

    - name: Artifact (AppImage)
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.metadata.outputs.id }}-linux
        path: main/makelove-build/${{ steps.metadata.outputs.version }}/appimage/${{ steps.metadata.outputs.id }}-linux.AppImage

    - name: Artifact (Win64)
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.metadata.outputs.id }}-win64
        path: main/makelove-build/${{ steps.metadata.outputs.version }}/win64/${{ steps.metadata.outputs.id }}-win64.zip

    - name: Artifact (Win32)
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.metadata.outputs.id }}-win32
        path: main/makelove-build/${{ steps.metadata.outputs.version }}/win32/${{ steps.metadata.outputs.id }}-win32.zip

    - name: Artifact (MacOS)
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.metadata.outputs.id }}-macos
        path: main/makelove-build/${{ steps.metadata.outputs.version }}/macos/${{ steps.metadata.outputs.id }}-macos.zip

    - name: Artifact (Android)
      if: github.event_name != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.metadata.outputs.id }}-android
        path: main/makelove-build/${{ steps.metadata.outputs.version }}/android/*.apk

    # --- Release Asset Uploads ---
    - name: Upload Release Assets
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@v2
      with:
        file: main/makelove-build/${{ steps.metadata.outputs.version }}/**/*
        file_glob: true
